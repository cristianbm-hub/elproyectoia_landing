<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo degradado -->
  <defs>
    <!-- Gradientes -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    
    <radialGradient id="lightGradient" cx="50%" cy="30%" r="60%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0" />
    </radialGradient>
    
    <!-- Filtros para efectos -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Fondo -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- Luz de fondo -->
  <ellipse cx="600" cy="200" rx="400" ry="300" fill="url(#lightGradient)"/>
  
  <!-- Patrón de grid -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e40af" stroke-width="0.5" opacity="0.1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.3"/>
  
  <!-- Elementos decorativos circulares -->
  <circle cx="150" cy="100" r="60" fill="#3b82f6" opacity="0.1"/>
  <circle cx="1050" cy="500" r="80" fill="#8b5cf6" opacity="0.15"/>
  <circle cx="200" cy="550" r="40" fill="#6366f1" opacity="0.2"/>
  
  <!-- Icono de cerebro estilizado -->
  <g transform="translate(100, 150)">
    <!-- Cerebro principal -->
    <path d="M80 40 C120 10, 180 10, 220 40 C240 60, 240 100, 220 120 C180 150, 120 150, 80 120 C60 100, 60 60, 80 40 Z" 
          fill="#3b82f6" opacity="0.8" filter="url(#glow)"/>
    <!-- Divisiones del cerebro -->
    <path d="M150 40 Q150 80, 150 120" stroke="#60a5fa" stroke-width="2" fill="none" opacity="0.6"/>
    <path d="M120 60 Q150 70, 180 60" stroke="#60a5fa" stroke-width="1.5" fill="none" opacity="0.5"/>
    <path d="M120 100 Q150 110, 180 100" stroke="#60a5fa" stroke-width="1.5" fill="none" opacity="0.5"/>
    
    <!-- Circuitos -->
    <circle cx="110" cy="70" r="3" fill="#fbbf24" opacity="0.8"/>
    <circle cx="190" cy="90" r="3" fill="#fbbf24" opacity="0.8"/>
    <circle cx="130" cy="110" r="2" fill="#10b981" opacity="0.8"/>
    <circle cx="170" cy="75" r="2" fill="#10b981" opacity="0.8"/>
    
    <!-- Conexiones -->
    <path d="M110 70 L130 110" stroke="#fbbf24" stroke-width="1" opacity="0.4"/>
    <path d="M190 90 L170 75" stroke="#10b981" stroke-width="1" opacity="0.4"/>
  </g>
  
  <!-- Título principal -->
  <text x="600" y="250" 
        font-family="Arial, sans-serif" 
        font-size="64" 
        font-weight="bold" 
        text-anchor="middle" 
        fill="url(#textGradient)"
        filter="url(#glow)">
    El Proyecto IA
  </text>
  
  <!-- Subtítulo -->
  <text x="600" y="320" 
        font-family="Arial, sans-serif" 
        font-size="28" 
        text-anchor="middle" 
        fill="#93c5fd" 
        opacity="0.9">
    Comunidad, Cursos y Oportunidades en Inteligencia Artificial
  </text>
  
  <!-- Descripción -->
  <text x="600" y="380" 
        font-family="Arial, sans-serif" 
        font-size="20" 
        text-anchor="middle" 
        fill="#cbd5e1" 
        opacity="0.8">
    Únete a la comunidad más grande de IA en español
  </text>
  
  <!-- Elementos tecnológicos decorativos -->
  <g transform="translate(900, 200)" opacity="0.3">
    <!-- Nodos -->
    <circle cx="0" cy="0" r="4" fill="#3b82f6"/>
    <circle cx="30" cy="20" r="3" fill="#6366f1"/>
    <circle cx="60" cy="0" r="4" fill="#8b5cf6"/>
    <circle cx="30" cy="-20" r="3" fill="#06b6d4"/>
    
    <!-- Conexiones -->
    <line x1="0" y1="0" x2="30" y2="20" stroke="#3b82f6" stroke-width="1"/>
    <line x1="30" y1="20" x2="60" y2="0" stroke="#6366f1" stroke-width="1"/>
    <line x1="0" y1="0" x2="30" y2="-20" stroke="#06b6d4" stroke-width="1"/>
    <line x1="30" y1="-20" x2="60" y2="0" stroke="#8b5cf6" stroke-width="1"/>
  </g>
  
  <!-- URL en la parte inferior -->
  <text x="600" y="570" 
        font-family="Arial, sans-serif" 
        font-size="24" 
        text-anchor="middle" 
        fill="#60a5fa" 
        opacity="0.7">
    elproyectoia.com
  </text>
  
  <!-- Efectos de partículas -->
  <g opacity="0.4">
    <circle cx="200" cy="200" r="1" fill="#fbbf24">
      <animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="800" cy="150" r="1.5" fill="#10b981">
      <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite" begin="1s"/>
    </circle>
    <circle cx="1000" cy="300" r="1" fill="#f59e0b">
      <animate attributeName="opacity" values="0;1;0" dur="4s" repeatCount="indefinite" begin="0.5s"/>
    </circle>
    <circle cx="300" cy="400" r="1.5" fill="#06b6d4">
      <animate attributeName="opacity" values="0;1;0" dur="2.5s" repeatCount="indefinite" begin="2s"/>
    </circle>
  </g>
</svg> 